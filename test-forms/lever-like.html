<!doctype html><html><head><meta charset="utf-8"><title>Lever-style application (synthetic)</title><style>body{font-family:system-ui;max-width:680px;margin:24px auto}.application-question{margin:12px 0}.application-label{font-weight:600}</style></head>
<body><h1>Platform Engineer (synthetic Lever-style form)</h1>
<form method="post" action="/submit" id="application-form">
  <div class="application-question"><div class="application-label">Resume/CV ✱</div><input type="file" name="resume" required></div>
  <div class="application-question"><div class="application-label">Full name ✱</div><input type="text" name="name" required></div>
  <div class="application-question"><div class="application-label">Email ✱</div><input type="email" name="email" required></div>
  <div class="application-question"><div class="application-label">Phone</div><input type="text" name="phone"></div>
  <div class="application-question"><div class="application-label">Current company</div><input type="text" name="org"></div>
  <div class="application-question"><div class="application-label">LinkedIn URL</div><input type="text" name="urls[LinkedIn]"></div>
  <div class="application-question"><div class="application-label">GitHub URL</div><input type="text" name="urls[GitHub]"></div>
  <div class="application-question"><div class="application-label">Portfolio URL</div><input type="text" name="urls[Portfolio]"></div>
  <div class="application-question"><div class="application-label">Do you have the right to work in Australia? ✱</div>
    <label><input type="radio" name="cards[abc][field0]" value="Yes" required> Yes</label><label><input type="radio" name="cards[abc][field0]" value="No"> No</label></div>
  <div class="application-question"><div class="application-label">Please select ✱</div><div class="application-sublabel">Which office would you prefer?</div>
    <select name="cards[abc][field1]" required><option value="">Select…</option><option>Sydney</option><option>Melbourne</option><option>Remote</option></select></div>
  <div class="application-question"><div class="application-label">Additional information</div><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></div>
  <button type="submit">Submit application</button>
</form></body></html>
